 
llm:
  provider: ollama
  model: cniongolo/biomistral
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 2048

embedding:
  model: BAAI/bge-large-en-v1.5
  device: cpu
  batch_size: 32

chroma:
  persist_dir: ./data/chroma_db
  collection_name: medical_documents
  distance_metric: cosine

rag:
  chunk_size: 512
  chunk_overlap: 50
  window_size: 3
  top_k: 5

agent:
  max_iterations: 5
  verbose: true
  timeout_seconds: 60

web_search:
  enabled: true
  max_results: 3

data:
  documents_dir: ./data/documents/
  supported_formats:
    - .pdf
    - .docx
    - .txt